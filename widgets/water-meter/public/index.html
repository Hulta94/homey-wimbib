<html>
  <head>
    <style>
      .wm {
        --wm-text: var(--homey-text-color, #1a1d21);
        --wm-muted: var(--homey-text-color-light, #8a8f98);
        --wm-accent: var(--homey-color-blue-500, #2b7bd6);
        --wm-line: var(--homey-line-color, rgba(128, 128, 128, 0.22));
        --wm-ok: var(--homey-color-green-500, #2f9e5b);
        --wm-warn: var(--homey-color-orange-500, #e08a00);
        --wm-bad: var(--homey-color-red-500, #d93d33);
        color: var(--wm-text);
        display: grid;
        gap: 10px;
        padding: 2px 4px;
      }
      .wm-head, .wm-main, .wm-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .wm-name { font-size: 13px; color: var(--wm-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .wm-status { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
      .wm-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
      .wm-status.ok { color: var(--wm-ok); }
      .wm-status.warn { color: var(--wm-warn); }
      .wm-status.bad { color: var(--wm-bad); }
      .wm-today { display: grid; }
      .wm-big { font-size: 30px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
      .wm-big small { font-size: 15px; font-weight: 500; color: var(--wm-muted); margin-left: 3px; }
      .wm-label { font-size: 12px; color: var(--wm-muted); }
      .wm-side { display: grid; justify-items: end; gap: 2px; text-align: right; }
      .wm-total { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 15px; font-variant-numeric: tabular-nums; }
      .wm-total .red { color: var(--wm-bad); }

      .wm-periods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
      .wm-period { display: grid; gap: 1px; padding: 6px 8px; border-radius: 8px; background: var(--wm-line); min-width: 0; }
      .wm-period b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .wm-period b small { font-size: 11px; font-weight: 500; color: var(--wm-muted); margin-left: 2px; }
      .wm-period span { font-size: 11px; color: var(--wm-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .wm-chart { display: flex; align-items: stretch; gap: 1px; height: 92px; border-bottom: 1px solid var(--wm-line); }
      .wm-col { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px; }
      .wm-col em { font-style: normal; font-size: 9px; line-height: 1; color: var(--wm-muted); font-variant-numeric: tabular-nums; writing-mode: vertical-rl; transform: rotate(180deg); }
      .wm-col.peak em { color: var(--wm-text); font-weight: 600; }
      .wm-col i { display: block; width: 100%; max-width: 12px; background: var(--wm-accent); border-radius: 2px 2px 0 0; opacity: 0.85; }
      .wm-col i.zero { background: var(--wm-line); opacity: 1; }
      .wm-col.now i { opacity: 0.45; }
      .wm-hours { display: flex; gap: 1px; margin-top: -6px; }
      .wm-hours span { flex: 1; min-width: 0; text-align: center; font-size: 9px; color: var(--wm-muted); font-variant-numeric: tabular-nums; }
      .wm-foot { font-size: 11px; color: var(--wm-muted); }
      .wm-empty { font-size: 13px; color: var(--wm-muted); text-align: center; padding: 40px 8px; }
    </style>
  </head>

  <body class="homey-widget">
    <div class="wm" id="wm">
      <div class="wm-empty">…</div>
    </div>

    <script type="text/javascript">
      const TEXT = {
        en: {
          today: 'used today', flow: 'Flow', maxFlow: 'Max flow today',
          yesterday: 'Yesterday', thisMonth: 'This month', lastMonth: 'Last month', partial: 'partial',
          online: 'Online', offline: 'Offline', noDevice: 'Add a wimbib device to see your water use.',
          noData: 'Hourly use appears after the first full hour.', updated: 'Updated', perHour: 'L per hour',
          alarm: { leak: 'Leak alarm', burst: 'Burst alarm', dry: 'Dry alarm', reverse: 'Reverse flow' },
          signal: { good: 'Good Wi-Fi', fair: 'Fair Wi-Fi', weak: 'Weak Wi-Fi', poor: 'Poor Wi-Fi' },
        },
        sv: {
          today: 'förbrukat idag', flow: 'Flöde', maxFlow: 'Maxflöde idag',
          yesterday: 'Igår', thisMonth: 'Denna månad', lastMonth: 'Förra månaden', partial: 'ofullständig',
          online: 'Ansluten', offline: 'Ej ansluten', noDevice: 'Lägg till en wimbib-enhet för att se din vattenförbrukning.',
          noData: 'Förbrukning per timme visas efter första hela timmen.', updated: 'Uppdaterad', perHour: 'L per timme',
          alarm: { leak: 'Läcklarm', burst: 'Spricklarm', dry: 'Torrlarm', reverse: 'Backflöde' },
          signal: { good: 'Bra Wi-Fi', fair: 'Okej Wi-Fi', weak: 'Svag Wi-Fi', poor: 'Dålig Wi-Fi' },
        },
      };
      let t = TEXT.en;
      let lang = 'en';
      let device = null;

      const root = document.getElementById('wm');
      const locale = () => (lang === 'sv' ? 'sv-SE' : 'en-GB');
      const fmt = (n, d) => n == null ? '–' : Number(n).toLocaleString(locale(), { minimumFractionDigits: d, maximumFractionDigits: d });
      const clock = (ms) => new Date(ms).toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' });
      const hour = (ms) => new Date(ms).toLocaleTimeString(locale(), { hour: '2-digit' }).replace(/\D/g, '');
      const monthName = (period) => period ? new Date(period + '-01T12:00:00Z').toLocaleDateString(locale(), { month: 'long' }) : '';
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

      function signal(rssi) {
        if (rssi == null) return '';
        if (rssi >= -60) return t.signal.good;
        if (rssi >= -70) return t.signal.fair;
        if (rssi >= -80) return t.signal.weak;
        return t.signal.poor;
      }

      function status(d) {
        const active = Object.keys(t.alarm).filter((k) => d.alarms && d.alarms[k] === true);
        if (active.length) return { cls: 'bad', text: active.map((k) => t.alarm[k]).join(', ') };
        if (!d.available) return { cls: 'warn', text: t.offline };
        return { cls: 'ok', text: t.online };
      }

      // Volume with unit; a partial period (not seen from its start) is shown as "at least"
      function volume(p) {
        if (!p || p.litres == null) return '–';
        const prefix = p.partial ? '≥ ' : '';
        if (p.litres >= 1000) return prefix + fmt(p.litres / 1000, 2) + '<small>m³</small>';
        return prefix + fmt(p.litres, 0) + '<small>L</small>';
      }

      function register(total) {
        if (total == null) return '–';
        const [whole, dec] = Number(total).toFixed(3).split('.');
        return whole + '.<span class="red">' + dec + '</span> m³';
      }

      function period(label, p, sub) {
        const title = p && p.partial ? ' title="' + t.partial + '"' : '';
        return '<div class="wm-period"' + title + '><b>' + volume(p) + '</b><span>' + esc(sub || label) + '</span></div>';
      }

      function chart(hourly) {
        const max = Math.max(1, ...hourly.map((h) => h.litres));
        const peak = hourly.reduce((a, b) => (b.litres > a.litres ? b : a), hourly[0]);
        const cols = hourly.map((h, i) => {
          const cls = 'wm-col' + (i === hourly.length - 1 ? ' now' : '') + (h === peak && h.litres > 0 ? ' peak' : '');
          const height = Math.max(2, (h.litres / max) * 62);
          return '<div class="' + cls + '" title="' + clock(Date.parse(h.t)) + ' · ' + h.litres + ' L">'
            + '<em>' + h.litres + '</em>'
            + '<i class="' + (h.litres === 0 ? 'zero' : '') + '" style="height:' + height + 'px"></i></div>';
        }).join('');
        const hours = hourly.map((h, i) => '<span>' + (i % 3 === 0 ? hour(Date.parse(h.t)) : '') + '</span>').join('');
        return '<div class="wm-chart" aria-label="' + t.perHour + '">' + cols + '</div><div class="wm-hours">' + hours + '</div>';
      }

      function render() {
        if (!device) {
          root.innerHTML = '<div class="wm-empty">' + t.noDevice + '</div>';
          return;
        }
        const d = device;
        const s = status(d);
        const flowRow = d.flow != null
          ? t.flow + ' ' + fmt(d.flow, 1) + ' L/min'
          : (d.maxFlowDay != null ? t.maxFlow + ' ' + fmt(d.maxFlowDay, 1) + ' L/min' : '');
        const hourly = (d.hourly || []).slice(-24);

        root.innerHTML = ''
          + '<div class="wm-head"><span class="wm-name">' + esc(d.name) + '</span><span class="wm-status ' + s.cls + '">' + esc(s.text) + '</span></div>'
          + '<div class="wm-main">'
          + '<div class="wm-today"><span class="wm-big">' + volume(d.today) + '</span><span class="wm-label">' + t.today + '</span></div>'
          + '<div class="wm-side"><span class="wm-total">' + register(d.total) + '</span><span class="wm-label">' + flowRow + '</span></div>'
          + '</div>'
          + '<div class="wm-periods">'
          + period(t.yesterday, d.yesterday)
          + period(t.thisMonth, d.month, d.month && monthName(d.month.period))
          + period(t.lastMonth, d.lastMonth, d.lastMonth && monthName(d.lastMonth.period))
          + '</div>'
          + (hourly.length > 1 ? chart(hourly) : '<div class="wm-empty" style="padding:20px 8px">' + t.noData + '</div>')
          + '<div class="wm-foot"><span>' + (d.lastUpdate ? t.updated + ' ' + clock(d.lastUpdate) : '') + '</span><span>' + signal(d.wifiRssi) + '</span></div>';
      }

      function apply(result) {
        lang = result.language === 'sv' ? 'sv' : 'en';
        t = TEXT[lang];
        device = (result.devices && result.devices[0]) || null;
        render();
      }

      function onHomeyReady(Homey) {
        const load = () => Homey.api('GET', '/', {}).then(apply).catch((err) => {
          root.innerHTML = '<div class="wm-empty">' + esc(err && err.message ? err.message : err) + '</div>';
        });

        load().finally(() => Homey.ready());

        // Live updates after every poll, with a slow refresh as fallback
        Homey.on('wimbib:update', (data) => {
          if (!device || data.id === device.id) {
            device = data;
            render();
          }
        });
        setInterval(load, 60 * 1000);
      }
    </script>
  </body>
</html>
